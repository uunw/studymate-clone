services:
  postgres:
    image: postgres:17-alpine
    container_name: studymate-clone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate
      POSTGRES_DB: studymate
    ports:
      - "5432:5432"
    volumes:
      - studymate-clone-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymate -d studymate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studymate-clone-pgdata:
